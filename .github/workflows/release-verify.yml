name: release-verify

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Match tag to VERSION
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '\n' < VERSION)"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/workspace_audit.py --skip-git-hook --run-adapters
      - run: python3 scripts/release_check.py
